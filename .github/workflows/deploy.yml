name: Deploy Gocareer Landing Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Static site lives in site/ — no npm build.
      # Requires EC2 SSH (port 22) reachable from GitHub Actions,
      # with secrets EC2_HOST + EC2_KEY set on this repo.
      - name: Deploy static site to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "site/*"
          target: "/home/ubuntu/Gocareer-Landingpage"
          strip_components: 1
          overwrite: true
          timeout: 120s
          command_timeout: 20m

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          timeout: 120s
          script: |
            sudo nginx -t
            sudo systemctl reload nginx
